# Local profile example
# Start with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.application.name=x-file-storage-rustfs

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

dromara.x-file-storage.default-platform=amazon-s3-1
dromara.x-file-storage.amazon-s3[0].platform=amazon-s3-1
dromara.x-file-storage.amazon-s3[0].enable-storage=true
dromara.x-file-storage.amazon-s3[0].access-key=${AWS_ACCESS_KEY_ID:rustfsadmin}
dromara.x-file-storage.amazon-s3[0].secret-key=${AWS_SECRET_ACCESS_KEY:rustfsadmin}
dromara.x-file-storage.amazon-s3[0].region=${AWS_REGION:us-east-1}
dromara.x-file-storage.amazon-s3[0].bucket-name=${AWS_S3_BUCKET:demo}
dromara.x-file-storage.amazon-s3[0].end-point=${AWS_S3_ENDPOINT:http://127.0.0.1:9000}
dromara.x-file-storage.amazon-s3[0].domain=${AWS_S3_DOMAIN:}
dromara.x-file-storage.amazon-s3[0].base-path=uploads/

app.storage.presign.expire-seconds=900
app.storage.presign.max-expire-seconds=604800

